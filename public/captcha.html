<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Meadow</title>
    <link rel="icon" type="image/png" href="/logo-square.png">
    <style>
      /* the captcha alone, in a small window the client opens over its login
         screen (its app/main.js); the answer goes back through that
         window's preload. */
      @font-face { font-family: "DigitalDelivery"; font-weight: 400; src: url("/fonts/CCDigitalDelivery-Regular.otf") format("opentype"); }
      :root { color-scheme: dark; }
      html, body { height: 100%; }
      body {
        margin: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        background: #12001f;
        color: #b7a0d4;
        font: 14px/1.4 "DigitalDelivery", system-ui, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #status { margin: 0; text-align: center; }
      button { display: none; border: 1px solid #b7a0d4; border-radius: 5px; padding: 6px 12px; background: transparent; color: #e3d4f5; font: inherit; cursor: pointer; }
      button.show { display: block; }
      @font-face { font-family: "Dimbo"; font-display: swap; src: url("/fonts/Dimbo-Regular.ttf") format("truetype"); }
      /* Meadow: titles in Dimbo, as in the client */
      h1, h2 { font-family: "Dimbo", "DigitalDelivery", system-ui, sans-serif; font-weight: 400; font-synthesis: none; letter-spacing: 0.01em; }
      /* ... and the client's dots behind the page, with its purple glow at the top */
      body {
        background:
          radial-gradient(circle, rgba(157, 0, 255, 0.22) 1.3px, transparent 1.8px) 0 0 / 22px 22px,
          radial-gradient(ellipse 80% 50% at 50% 0%, rgba(157, 0, 255, 0.24), transparent 70%),
          #12001f;
        background-attachment: fixed;
      }
    </style>
  </head>
  <body>
    <div id="widget"></div>
    <p id="status" role="status">Checking…</p>
    <button id="retry" type="button">Try again</button>
    <script src="/captcha.js"></script>
    <script>
      "use strict";

      const action = new URLSearchParams(location.search).get("action") === "signup" ? "signup" : "login";
      const status = document.getElementById("status");
      const retry = document.getElementById("retry");
      const done = token => {
        if (window.burrowCaptcha) {
          window.burrowCaptcha.done(token);
        }
      };
      if (!window.captcha.on) {
        status.textContent = "No captcha needed.";
        done("");
      }
      else {
        // cloudflare may try again after an error, and an answer can still come.
        const check = window.captcha.mount(document.getElementById("widget"), action, {appearance: "always", onAnswer: token => {
          status.textContent = "Done.";
          done(token);
        }});
        check.answer().then(token => {
          if (!token) {
            status.textContent = "Captcha could not load. Check your connection or content blocker.";
            retry.classList.add("show");
          }
        });
      }
      retry.addEventListener("click", () => location.reload());
    </script>
  </body>
</html>
